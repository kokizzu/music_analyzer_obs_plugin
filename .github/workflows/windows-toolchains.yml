name: Windows toolchains

on:
  push:
  pull_request:

jobs:
  compile-smoke:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run Windows toolchain checks
        run: python scripts/test_windows_ci.py
