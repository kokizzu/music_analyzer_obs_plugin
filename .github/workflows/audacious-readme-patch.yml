name: Temporary Audacious README patch

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-readme-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/audacious-song-title-overlay'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audacious-song-title-overlay
          fetch-depth: 0

      - name: Add Audacious OBS specification to README
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          marker = "## Audacious Song Title in OBS"
          anchor = (
              "If the overlay says `ADD MUSIC ANALYZER FILTER TO AN AUDIO SOURCE`, "
              "the overlay is loaded but it has not received analyzer data yet. "
              "Add `Music Analyzer Filter` to the actual music/audio source, not to the overlay source.\n"
          )
          spec = r'''

## Audacious Song Title in OBS

On Linux, the OBS plugin replaces the source-name text in the `MUSIC ANALYZER` header with the current Audacious song title or filename. This behavior is OBS-only; the standalone and Android renderers keep their existing input/source labels.

Detection and display rules:

- Audacious process state is checked with `pgrep -x audacious`.
- When Audacious is running, the plugin reads Audacious windows from `wmctrl -lx` and selects the most likely playback window title.
- The expected titlebar format is `Artist - Album - Song title/filename`. The plugin removes the first two fields and displays only `Song title/filename`.
- A two-field title such as `Artist - filename.flac` displays the second field. A plain title or filename is displayed unchanged.
- Optional Audacious decorations such as ` - Audacious`, `[Audacious]`, or an `Audacious - ` prefix are removed.
- If the window title is unavailable, including native Wayland windows that are not exposed by `wmctrl`, the plugin falls back to `audtool current-song`, then to the basename from `audtool current-song-filename`.
- When Audacious is not running, the header shows `AUDACIOUS NOT RUNNING`. When it is running but no usable title can be read, it shows `AUDACIOUS TITLE UNAVAILABLE`.
- Titles that fit remain static. Longer titles use a 34-character marquee, advance one character every 250 ms, and loop with a visible `---` separator.
- The built-in pixel font currently supports ASCII. Unsupported UTF-8 characters are replaced with `?` rather than corrupting the overlay text.

Performance constraints:

- External process/window queries are throttled to at most once per second; they are not executed for every rendered frame.
- Marquee movement uses only cached in-memory text between polls.
- The current song and scroll offset are cached, and the marquee resets only when the detected song changes.
- The existing analyzer audio callback and DSP worker are untouched by Audacious detection.

Runtime dependencies for full titlebar detection are `pgrep` and `wmctrl`; `audtool` is the fallback. Missing `wmctrl` does not disable the overlay when `audtool` is available.
'''

          if marker not in text:
              if anchor not in text:
                  raise SystemExit("README anchor not found")
              text = text.replace(anchor, anchor + spec, 1)
              path.write_text(text, encoding="utf-8")

      - name: Compile and run focused tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            tests/audacious_title.cpp src/audacious_title.cpp -Isrc \
            -o /tmp/audacious_title_tests
          /tmp/audacious_title_tests

      - name: Remove temporary workflow
        run: rm .github/workflows/audacious-readme-patch.yml

      - name: Commit README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/audacious-readme-patch.yml
          git commit -m "Document Audacious OBS title overlay"
          git push origin HEAD:agent/audacious-song-title-overlay
